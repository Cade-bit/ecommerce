$kind: http-request
method: POST
url: '{{base_url}}/api/user/register/'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "user@example.com",
      "first_name": "Example",
      "last_name": "User",
      "password": "change-me",
      "confirm_password": "change-me"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Registration returns success", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
