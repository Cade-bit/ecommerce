$kind: http-request
method: GET
url: '{{base_url}}/api/catalog/products/:product_id/'
order: 6000
pathVariables:
  - key: product_id
    value: '{{product_id}}'
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Product is returned", function () {
        pm.response.to.have.status(200);
      });
