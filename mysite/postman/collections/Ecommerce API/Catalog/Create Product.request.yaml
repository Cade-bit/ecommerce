$kind: http-request
method: POST
url: '{{base_url}}/api/catalog/products/'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
body:
  type: json
  content: |-
    {
      "product_name": "Example Product",
      "description": "Example product description",
      "price": "19.99",
      "quantity": 10,
      "image": null,
      "sub_categories": [],
      "delivery_info": "Ships in 3-5 business days",
      "notes": "Internal note"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Product is created", function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      const data = pm.response.json();
      if (data.id) pm.collectionVariables.set("product_id", String(data.id));
