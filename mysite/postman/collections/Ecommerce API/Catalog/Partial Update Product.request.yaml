$kind: http-request
method: PATCH
url: '{{base_url}}/api/catalog/products/:product_id/'
order: 8000
pathVariables:
  - key: product_id
    value: '{{product_id}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
body:
  type: json
  content: |-
    {
      "quantity": 15
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Product is partially updated", function () {
        pm.response.to.have.status(200);
      });
