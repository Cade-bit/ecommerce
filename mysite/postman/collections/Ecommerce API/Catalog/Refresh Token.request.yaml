$kind: http-request
method: POST
url: '{{base_url}}/api/catalog/token/refresh/'
order: 11000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refresh": "{{refresh_token}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Catalog token refresh succeeds", function () {
        pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      if (data.access) pm.collectionVariables.set("access_token", data.access);
